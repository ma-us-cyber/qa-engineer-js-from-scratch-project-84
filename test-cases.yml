    В списке отображаются только товары с ценой от 10 до 50 включительно

- summary: |
    Проверка мобильной версии сайта
  requirement: |
    Сайт должен иметь мобильную версию
  prerequisites: |
    Доступно мобильное устройство или эмулятор Chrome DevTools Mobile View
  test-data: |
    Ширина экрана = 375px
    Устройство = iPhone SE
  steps:
    - Открыть сайт в эмуляторе мобильного устройства
    - Проверить отображение шапки, каталога и карточек товаров
    - Проверить кликабельность кнопок
    - Проверить отсутствие горизонтальной прокрутки
  expected-result: |
    Верстка адаптирована под мобильный экран, элементы интерфейса отображаются корректно и доступны для взаимодействия, горизонтальная прокрутка отсутствует


- summary: |
    Проверка совместимости сайта с последними версиями браузеров
  requirement: |
    Сайт нужно протестировать на совместимость с последними версиями браузеров
  prerequisites: |
    Установлены последние версии браузеров: Chrome, Firefox, Safari, Edge
  test-data: |
    Браузеры = Chrome, Firefox, Safari, Edge
  steps:
    - Открыть сайт в указанных браузерах
    - Проверить отображение каталога, поиск и добавление товара в корзину
  expected-result: |
    Сайт корректно отображается и работает во всех указанных браузерах


- summary: |
    Проверка устойчивости сайта при высокой нагрузке.
  requirement: |
    Сайт должен корректно работать при большом количестве одновременных пользователей.
  prerequisites: |
    URL главной = https://products-store.hexlet.app
    доступен способ создать нагрузку
  test-data: |
    URL главной = https://products-store.hexlet.app
  steps:
    - Создать нагрузку на сайт
    - Открыть главную страницу
    - Проверить, что страница загружается
    - Проверить, что отсутствуют ошибки
  expected-result: |
    Сайт остается доступным
    Главная страница загружается
    Критических ошибок нет


- summary: |
      Проверка просмотра списка товаров
  requirement: |
      Пользователь должен иметь возможность просматривать товары
  prerequisites: |
      Сайт открыт, каталог товаров заполнен
  test-data: |
      Страница каталога, категория «beauty»
  steps:
      - Перейти в категорию «beauty»
      - Прокрутить страницу со списком товаров
      - Обратить внимание на карточки товаров (название, цена, фото, кнопка «В корзину»)
  expected-result: |
      На странице отображается список товаров с основными характеристиками. Карточки товаров читаемы, кликабельны, нет ошибок отображения.


- summary: |
      Проверка просмотра подробной информации о товаре
  requirement: |
      Пользователь должен иметь возможность просматривать подробную информацию о товаре
  prerequisites: |
      Сайт открыт, товар присутствует в каталоге
  test-data: |
      Товар = «Essence Mascara Lash Princess»
  steps:
      - Найти в каталоге товар «Essence Mascara Lash Princess»
      - Под фото товара отоброжается краткая характеристика
      - Изучить содержимое страницы товара
  expected-result: |
      Открыта страница с детальной информацией: полное название, описание, характеристики, фотогалерея, цена, кнопка «В корзину». Все данные отображаются корректно.


- summary: |
      Проверка добавления товара в корзину
  requirement: |
      Пользователь должен иметь возможность добавлять товары в корзину
  prerequisites: |      
      Корзина пуста, товар доступен для покупки
  test-data: |
      Товар = «Essence Mascara Lash Princess»
  steps:
      - Найти товар «Essence Mascara Lash Princess» в каталоге
      - Нажать кнопку «В корзину» на карточке товара или на странице товара
  expected-result: |
      Счётчик корзины в шапке сайта увеличивается на 1, товар сохраняется в корзине (можно проверить переходом в корзину).В корзину должен добавиться товар


- summary: |
    Просмотр содержимого корзины с добавленным товаром
  requirement: |
    Пользователь должен иметь возможность просматривать содержимое корзины
  prerequisites: |
    В корзине есть хотя бы один товар
  test-data: |
    Нет
  steps:
    - Нажать на иконку корзины в шапке сайта
  expected-result: |
    Открывается страница корзины, в списке отображается добавленный товар с названием, изображением, ценой, количеством и итоговой суммой; счётчик в шапке соответствует количеству товаров в корзине


- summary: |
      Проверка доступности на различных устройствах
  requirement: |
      Сайт должен быть доступен на различных устройствах
  prerequisites: |
      Доступ к разным типам устройств: ПК, планшет, смартфон
  test-data: |
      Устройства = [Desktop 1920x1080, Tablet 1024x768, Mobile 375x667]
  steps:
      - Открыть сайт на каждом устройстве
      - Проверить масштабирование, читаемость текста, работу интерактивных элементов
      - Убедиться, что нет обрезанных элементов или неработающих функций
  expected-result: |
      Сайт корректно отображается на всех устройствах. Функционал (поиск, корзина, фильтры) полностью доступен. Верстка не ломается при смене ориентации экрана.


- summary: |
      Проверка переключения языка интерфейса
  requirement: |
      Пользователь должен иметь возможность переключить язык интерфейса
  prerequisites: |
      Сайт открыт на английском языке, доступны варианты языков (English English, Russian, Spanish)
  test-data: |
      Целевой язык = «Russian»
  steps:
      - Найти переключатель языка в шапке сайта
      - Кликнуть по варианту «Russian»
  expected-result: |
      Интерфейс сайта (меню, кнопки, заголовки) отображается на русском языке, описание товаров и их названия на русском языке


- summary: |
      Проверка локализации (перевода) на русский и английский языки
  requirement: |
      Сайт должен иметь локализацию (перевод) на русский и английский языки
  prerequisites: |
      Включены два языка в настройках сайта
  test-data: |
      Языки = English English, Russian
  steps:
      - Переключить интерфейс на русский язык, проверить основные страницы
      - Переключить интерфейс на английский язык, проверить те же страницы
      - Обратить внимание числа, валюты, единицы измерения
      - Проверить, что нет смешения языков в одном интерфейсе
  expected-result: |
      Все тексты корректно переведены на выбранный язык. Нет непереведённых строк или ошибок кодировки.


- summary: |
    Проверка доступности сайта без использования VPN
  requirement: |
    Сайт должен быть доступен для пользователей без использования VPN
  prerequisites: |
    Тестирование проводится из обычной интернет-сети без включённого VPN
  test-data: |
    URL сайта = https://products-store.hexlet.app/
  steps:
    - Открыть URL https://products-store.hexlet.app/ в браузере без VPN
    - Проверить, что страница загружается
    - Убедиться, что открывается главная страница сайта
    - Проверить доступность основных элементов интерфейса
  expected-result: |
    Сайт открывается без использования VPN, главная страница загружается корректно, основные элементы интерфейса доступны

      
