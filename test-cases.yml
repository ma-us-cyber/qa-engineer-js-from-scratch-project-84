---
- summary: |
    Проверка отсутствия ошибок загрузки ресурсов
  requirement: |
    Сайт должен загружаться без ошибок
  prerequisites: |
    Сайт открыт, DevTools доступны
  test-data: |
    Страницы сайта
  steps:
    - Открыть сайт интернет магазина https://products-store.hexlet.app/ в браузере
    - Открыть DevTools (F12)
    - Перейти во вкладку Network
    - Обновить страницу (F5)
    - В колонке Status будут коды ответов
    - В поле фильтра введи 4xx и отдельно 5xx
    - Проверить, что нет запросов с кодами 4xx и 5xx
  expected-result: |
    Все ресурсы загружаются без ошибок

