---
- summary: |
    Краткое описание тест-кейса. Например, проверка входа пользователя с существующими логином и паролем
  requirement: |
    Тестируемое требование. Например, при верном вводе логине и пароля пользователь должен войти в систему
  prerequisites: |
    Это условия, которые необходимы для проведения тест-кейса. Они должны быть выполнены еще до запуска тест-кейса.
    Например, открыта страница логина
  test-data: |
    Тестовые данные
    Логин = ilona Пароль = password
  steps:
    - Вводим логин
    - Вводим пароль
    - Нажимаем кнопку «Войти»
  expected-result: |
    Пользователь должен попасть на главную страницу

- summary: |
    Проверка входа пользователя с несуществующими логином и паролем
  requirement: |
    При неправильном логине или пароле пользователь должен получить сообщение об ошибке
  prerequisites:
    Открыта страница логина
  test-data: |
    Логин = Логин = hexlet Пароль = badpass
  steps:
    - Вводим логин
    - Вводим пароль
    - Нажимаем кнопку «Войти»
  expected-result: |
    Пользователь должен попасть на главную страницу

   - summary: |
      Проверка поиска товара по ключевому слову
    requirement: |
      Пользователь должен иметь возможность искать товары по ключевому слову
    prerequisites: |
      Сайт открыт, пользователь на главной странице, каталог товаров заполнен
    test-data: |
      Ключевое слово = "лак"
    steps:
      - Ввести в строку поиска слово «лак»
      - Нажать кнопку «Поиск» или клавишу Enter
    expected-result: |
      Не отображается список товаров, содержащих слово «лак» в названии или описании 

     - summary: |
      Проверка фильтрации товаров по категории
    requirement: |
      Пользователь должен иметь возможность фильтровать товары
    prerequisites: |
      Сайт открыт, пользователь находится в каталоге товаров
    test-data: |
      Категория = «beauty»
    steps:
      - Выбрать категорию «beauty» в фильтре 
      - Нажать кнопку клавишу Enter
    expected-result: |
      В списке отображаются только товары из категории «beauty»

      - summary: |
      Проверка переключения языка интерфейса
    requirement: |
      Пользователь должен иметь возможность переключить язык интерфейса
    prerequisites: |
      Сайт открыт на английском языке
    test-data: |
      Целевой язык = «English»
    steps:
      - Найти переключатель языка в шапке сайта
      - Кликнуть по варианту «English»
    expected-result: |
      Интерфейс сайта (меню, кнопки, заголовки) отображается на английском языке

      - summary: |
      Проверка расчёта итоговой стоимости в корзине
    requirement: |
      Должен производиться корректный расчёт итоговой стоимости в корзине с учётом количества и цен
    prerequisites: |
      В корзине находятся товары с разными ценами и количествами
    test-data: |
      Товар 1 = «Chanel Coco Noir Eau De» (цена = 108.53$, количество = 1)
      Товар 2 = «Calvin Klein CK One» (цена = 49.05$, количество = 1)
    steps:
      - Добавить указанные товары в корзину в заданных количествах
      - Перейти на страницу корзины
    expected-result: |
      Итоговая сумма = 108.53$ + 49.05$  = 157.57 $
