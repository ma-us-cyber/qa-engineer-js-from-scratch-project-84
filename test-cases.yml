- summary: |
    Проверка защиты поиска от XSS
  requirement: |
    Сайт должен быть безопасным и защищать данные пользователя
  prerequisites: |
    Сайт открыт, доступна строка поиска
  test-data: |
    XSS = <script>alert("test")</script>
  steps:
    - Ввести в строку поиска XSS-payload
    - Нажать Enter
  expected-result: |
    Введённый текст отображается как обычный текст, скрипт не выполняется

- summary: |
    Проверка поиска товара по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову
  prerequisites: |
    Сайт открыт, пользователь на главной странице, каталог товаров заполнен
  test-data: |
    Поиск = Kiwi
  steps:
    - Ввести в строку поиска слово «Kiwi»
    - Нажать кнопку «Поиск» или клавишу Enter
  expected-result: |
    Отображается список товаров, содержащих слово «Kiwi» в названии

- summary: |
    Проверка поиска товара по категории
