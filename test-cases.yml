---
  - summary: |
      Проверка поиска товара по ключевому слову
    requirement: |
      Пользователь должен иметь возможность искать товары по ключевому слову
    prerequisites: |
      Сайт открыт, пользователь на главной странице, каталог товаров заполнен
    test-data: |
      Ключевое слово = "лак"
    steps:
      - Ввести в строку поиска слово «лак»
      - Нажать кнопку «Поиск» или клавишу Enter
    expected-result: |
      Не отображается список товаров, содержащих слово «лак» в названии или описании 

     - summary: |
      Проверка фильтрования товаров по категории
    requirement: |
      Пользователь должен иметь возможность фильтровать товары
    prerequisites: |
      Сайт открыт, пользователь находится в каталоге товаров
    test-data: |
      Категория = «beauty»
    steps:
      - Выбрать категорию «beauty» в фильтре 
      - Нажать кнопку клавишу Enter
    expected-result: |
      В списке отображаются только товары из категории «beauty»

      - summary: |
      Проверка переключения языка интерфейса
    requirement: |
      Пользователь должен иметь возможность переключить язык интерфейса
    prerequisites: |
      Сайт открыт на английском языке, доступны варианты языков (English English, Russian, Spanish)
    test-data: |
      Целевой язык = «Russian»
    steps:
      - Найти переключатель языка в шапке сайта
      - Кликнуть по варианту «Russian»
    expected-result: |
      Интерфейс сайта (меню, кнопки, заголовки) отображается на русском языке, описание товаров и их названия на английском языке

      - summary: |
      Проверка расчёта итоговой стоимости в корзине
    requirement: |
      Должен производиться корректный расчёт итоговой стоимости в корзине с учётом количества и цен
    prerequisites: |
      В корзине находятся товары с разными ценами и количествами
    test-data: |
      Товар 1 = «Chanel Coco Noir Eau De» (цена = 108.53$, количество = 1)
      Товар 2 = «Calvin Klein CK One» (цена = 49.05$, количество = 1)
    steps:
      - Добавить указанные товары в корзину в заданных количествах
      - Перейти на страницу корзины
    expected-result: |
      Итоговая сумма = 108.53$ + 49.05$  = 157.57 $

      - summary: |
      Проверка просмотра списка товаров
    requirement: |
      Пользователь должен иметь возможность просматривать товары
    prerequisites: |
      Сайт открыт, каталог товаров заполнен
    test-data: |
      Страница каталога, категория «beauty»
    steps:
      - Перейти в категорию «beauty»
      - Прокрутить страницу со списком товаров
      - Обратить внимание на карточки товаров (название, цена, фото, кнопка «В корзину»)
    expected-result: |
      На странице отображается список товаров с основными характеристиками. Карточки товаров читаемы, кликабельны, нет ошибок отображения.

      - summary: |
      Проверка просмотра подробной информации о товаре
    requirement: |
      Пользователь должен иметь возможность просматривать подробную информацию о товаре
    prerequisites: |
      Сайт открыт, товар присутствует в каталоге
    test-data: |
      Товар = «Essence Mascara Lash Princess»
    steps:
      - Найти в каталоге товар «Essence Mascara Lash Princess»
      - Под фото товара отоброжается краткая характеристика
      - Изучить содержимое страницы товара
    expected-result: |
      Открыта страница с детальной информацией: полное название, описание, характеристики, фотогалерея, цена, кнопка «В корзину». Все данные отображаются корректно.

      - summary: |
      Проверка добавления товара в корзину
    requirement: |
      Пользователь должен иметь возможность добавлять товары в корзину
    prerequisites: |
      Корзина пуста, товар доступен для покупки
    test-data: |
      Товар = «Essence Mascara Lash Princess»
    steps:
      - Найти товар «Essence Mascara Lash Princess» в каталоге
      - Нажать кнопку «В корзину» на карточке товара или на странице товара
    expected-result: |
      В корзину должен добавиться товар

      - summary: |
      Проверка удобства использования (UX) и скорости загрузки страниц
    requirement: |
      Сайт нужно разработать с учетом удобства использования и оптимизировать для скорости работы
    prerequisites: |
      Сайт развернут в тестовой среде, инструменты мониторинга (Lighthouse, WebPageTest) доступны
    test-data: |
      Страница = Главная, Страница = Каталог, Страница = Карточка товара
    steps:
      - Открыть главную страницу сайта
      - Пройти по основным сценариям: поиск, фильтрация, добавление в корзину
      - Замерить время загрузки страниц (FCP, LCP)
      - Оценить интуитивность навигации (можно привлечь 3–5 тестовых пользователей)
    expected-result: |
      Время загрузки основных страниц ≤ 2 сек при скорости соединения 3G. Элементы интерфейса интуитивно понятны, нет запутанных переходов. Оценка UX по шкале ≥ 4/5.

     - summary: |
      Проверка безопасности и защиты данных пользователя
    requirement: |
      Сайт должен быть безопасным и защищать данные пользователя
    prerequisites: |
      Доступ к инструментам сканирования уязвимостей (OWASP ZAP, Nessus), включен HTTPS
    test-data: |
      Форма регистрации, форма входа, передача персональных данных
    steps:
      - Проверить наличие и валидность SSL-сертификата (HTTPS)
      - Попытаться внедрить SQL-инъекцию в поле поиска и форму входа
      - Попробовать XSS-атаку через поле отзыва или комментария
      - Проанализировать заголовки безопасности (Content-Security-Policy, X-Frame-Options и др.)
    expected-result: |
      SSL-сертификат действителен, соединение защищено. Попытки инъекций и XSS не приводят к утечке данных или выполнению вредоносного кода. Заголовки безопасности настроены корректно.

  - summary: |
      Проверка мобильной версии сайта
    requirement: |
      Сайт должен иметь мобильную версию
    prerequisites: |
      Доступ к мобильным устройствам или эмуляторам (Chrome DevTools Mobile View)
    test-data: |
      Ширина экрана = 375px, Устройство = iPhone SE, Android Phone
    steps:
      - Открыть сайт в эмуляторе мобильного устройства
      - Проверить отображение шапки, каталог товаров, карточек товаров
      - Протестировать кликабельность кнопок (корзина, «В корзину»)
      - Проверить отсутствие горизонтальной прокрутки
    expected-result: |
      Верстка адаптирована под мобильные экраны. Все элементы читаемы и удобны для нажатия пальцем.Не кликабельность кнопок «В корзину» на главном меню. Горизонтальная прокрутка отсутствует, каталог корректно сворачивается.

  - summary: |
      Проверка совместимости с последними версиями браузеров
    requirement: |
      Сайт нужно протестировать на совместимость с последними версиями браузеров
    prerequisites: |
      Установлены последние версии браузеров: Chrome, Firefox, Safari, Edge
    test-data: |
      Браузеры = [Chrome 130+, Firefox 133+, Safari 18+, Edge 131+]
    steps:
      - Открыть сайт в каждом из указанных браузеров
      - Выполнить базовые сценарии: просмотр каталога, поиск, добавление товара в корзину
      - Проверить корректность отображения форм, кнопок, списков
    expected-result: |
      Сайт корректно отображается и функционирует во всех указанных браузерах. Нет критических ошибок верстки или неработающих кнопок.

  - summary: |
      Нагрузочное тестирование (обработка большого трафика)
    requirement: |
      Важно, чтобы сайт мог обрабатывать большое количество трафика
    prerequisites: |
      Доступ к инструменту нагрузочного тестирования (k6, JMeter, Locust)
    test-data: |
      Количество виртуальных пользователей = 1000, Длительность теста = 5 минут
    steps:
      - Настроить сценарий: просмотр каталога, поиск, добавление в корзину
      - Запустить нагрузочный тест с 1000 одновременных пользователей
      - Мониторить время ответа сервера, количество ошибок (5xx), использование ресурсов сервера
    expected-result: |
      95% запросов обрабатываются за ≤ 2 секунды. Процент ошибок < 1%. Сервер не падает, нет резкого роста времени ответа при пиковой нагрузке.

  - summary: |
      Проверка доступности на различных устройствах
    requirement: |
      Сайт должен быть доступен на различных устройствах
    prerequisites: |
      Доступ к разным типам устройств: ПК, планшет, смартфон
    test-data: |
      Устройства = [Desktop 1920x1080, Tablet 1024x768, Mobile 375x667]
    steps:
      - Открыть сайт на каждом устройстве
      - Проверить масштабирование, читаемость текста, работу интерактивных элементов
      - Убедиться, что нет обрезанных элементов или неработающих функций
    expected-result: |
      Сайт корректно отображается на всех устройствах. Функционал (поиск, корзина, фильтры) полностью доступен. Верстка не ломается при смене ориентации экрана.

  - summary: |
      # Проверка локализации (русский,английский языки и испанский)
    requirement: |
      Сайт должен иметь локализацию (перевод) на русский, испанский и английский языки
    prerequisites: |
      Включены три языка в настройках сайта
    test-data: |
      Языки = English English, Russian, Spanish
    steps:
      - Переключить интерфейс на русский язык, проверить основные страницы
      - Переключить интерфейс на английский язык, проверить те же страницы
      - Переключить интерфейс на испанский язык, проверить те же страницы
      - Обратить внимание числа, валюты, единицы измерения
      - Проверить, что нет смешения языков в одном интерфейсе
    expected-result: |
      Все тексты не корректно переведены на выбранный язык, кроме английского языка. Нет непереведённых строк или ошибок кодировки.

  - summary: |
      Проверка доступности сайта без использования VPN
    requirement: |
      Сайт должен быть доступен для пользователей без использования VPN (прямой доступ из сети Интернет)
    prerequisites: |
      Тестирование проводится из обычной интернет-сети (не корпоративной с ограничениями)
    test-data: |
      URL сайта = https://products-store.hexlet.app/
    steps:
      - Открыть URL https://products-store.hexlet.app/ в браузере без включённого VPN
      - Проверить, что сайт загружается (статус ответа HTTP = 200)
      - Убедиться, что все статические ресурсы (CSS, JS, изображения) загружаются без ошибок (нет 404/5xx в консоли браузера)
      - Выполнить базовые действия: открыть каталог, попробовать поиск по любому слову, открыть карточку товара
    expected-result: |
      Сайт загружается за разумное время (не более 5 секунд). Все ресурсы доступны, в консоли нет ошибок загрузки.
      Основные функции (каталог, поиск, карточка товара) работают без ограничений. Нет сообщений о блокировке или недоступности.

      - summary: |
      Проверка корректной работы форм ввода и обратной связи
    requirement: |
      Обеспечение корректной работы форм ввода и обратной связи
    prerequisites: |
      Сайт https://products-store.hexlet.app/ открыт в браузере
    test-data: |
      Поисковый запрос = "" (пустая строка)
      Поисковый запрос = "qwerty1234567890!@#$%^&*()"
      Поисковый запрос = "пудра" (валидный)
    steps:
      - Открыть сайт https://products-store.hexlet.app/
      - Ввести пустую строку в поле поиска и нажать «Поиск»
      - Ввести спецсимволы и очень длинную строку в поле поиска, нажать «Поиск»
      - Ввести валидный запрос «пудра» и нажать «Enter»
      - Проверить, появляется ли уведомление или сообщение об ошибке при некорректном вводе
    expected-result: |
      При пустом запросе поиск не выполняется.
      При вводе спецсимволов сайт не падает, выдаёт вразу "Ничего не найдено!".
      При валидном запросе результаты отображаются враза "Ничего не найдено!".

       summary: |
      Проверка бесперебойной работы при высокой нагрузке
    requirement: |
      Обеспечение бесперебойной работы в условиях высокой нагрузки
    prerequisites: |
      Доступ к инструменту нагрузочного тестирования (k6, JMeter или аналогичному)
    test-data: |
      URL = https://products-store.hexlet.app/
      Количество виртуальных пользователей = 500
      Длительность = 3 минуты
    steps:
      - Настроить сценарий: открытие главной → переход в каталог → поиск товара → открытие карточки товара
      - Запустить нагрузочный тест с 500 одновременных пользователей
      - Мониторить время ответа сервера и количество ошибок (5xx, таймауты)
    expected-result: |
      95% запросов обрабатываются за время ≤ 3 секунды.
      Количество ошибок (HTTP 5xx) составляет менее 1%.
      Сайт не падает и не зависает, после снятия нагрузки восстанавливает нормальную работу.

       - summary: |
      Проверка работы системы кэширования
    requirement: |
      Наличие системы кэширования для ускорения загрузки страниц
    prerequisites: |
      Сайт https://products-store.hexlet.app/ открыт, доступна панель разработчика (DevTools → Network)
    test-data: |
      Страница = Каталог товаров
    steps:
      - Открыть каталог товаров, замерить время загрузки (DevTools → Network, Disable cache = ON)
      - Повторно открыть ту же страницу (Disable cache = OFF)
      - Сравнить время загрузки первого и второго запроса
      - Проверить наличие заголовков кэширования (Cache-Control, ETag, Last-Modified) в ответах сервера
    expected-result: |
      Время загрузки при повторном открытии значительно меньше, чем при первом.
      В ответах сервера присутствуют заголовки кэширования (Cache-Control, ETag или Last-Modified).
      Статические ресурсы (CSS, JS, изображения) кэшируются и при повторной загрузке берутся из кэша.

  - summary: |
      Проверка валидации и очистки вводимых данных
    requirement: |
      Валидация и очистка вводимых данных — чтобы исключить некорректные или вредоносные значения в поиске, фильтрах, формах
    prerequisites: |
      Сайт https://products-store.hexlet.app/ открыт
    test-data: |
      SQL-инъекция = "' OR 1=1 --"
      XSS-_payload = "<script>alert('test')</script>"
      Максимальная длина = строка из 10000 символов «A»
    steps:
      - Ввести SQL-инъекцию в поле поиска, нажать «Поиск»
      - Ввести XSS-скрипт в поле поиска, нажать «Поиск»
      - Ввести строку из 10000 символов в поле поиска, нажать «Поиск»
      - Проверить, что сайт не падает и не выполняет внедрённый код
    expected-result: |
      SQL-инъекция не возвращает все товары из базы, а обрабатывается как обычный поисковый запрос.
      XSS-скрипт не выполняется — выводится как текст, без запуска alert.
      Строка максимальной длины обрезается или отклоняется с понятным сообщением, сайт не зависает.
      Нет утечки системных ошибок или данных базы в ответе.

  - summary: |
      Проверка сохранения состояния корзины между сессиями
    requirement: |
      Сохранение состояния корзины между сессиями
    prerequisites: |
      Сайт https://products-store.hexlet.app/ открыт, браузер не в режиме инкогнито
    test-data: |
      Товар = любой доступный товар из каталога
    steps:
      - Найти товар в каталоге и добавить его в корзину
      - Запомнить название и количество добавленного товара
      - Закрыть вкладку браузера
      - Открыть сайт заново в новой вкладке
      - Перейти в корзину и проверить содержимое
      - Перезагрузить страницу браузера и снова проверить корзину
    expected-result: |
      После закрытия и повторного открытия сайта товар остаётся в корзине.
      Количество и название товара совпадают с тем, что было добавлено ранее.
      После перезагрузки страницы корзина не обнуляется.

  - summary: |
      Проверка расчёта итоговой стоимости в корзине
    requirement: |
      Расчёт итоговой стоимости в корзине с учётом количества
    prerequisites: |
      Сайт https://products-store.hexlet.app/ открыт, корзина доступна
    test-data: |
      Товар 1 = любой товар (цена = P1, количество = 3)
      Товар 2 = любой другой товар (цена = P2, количество = 2)
    steps:
      - Найти товар 1 в каталоге, добавить в корзину
      - Изменить количество товара 1 на 3 в корзине
      - Найти товар 2 в каталоге, добавить в корзину
      - Изменить количество товара 2 на 2 в корзине
      - Записать цены обоих товаров с карточек
      - Сравнить сумму в корзине с расчётной: (P1 × 3) + (P2 × 2)
    expected-result: |
      Итоговая сумма в корзине точно соответствует расчётной: (P1 × 3) + (P2 × 2).
      При изменении количества сумма пересчитывается автоматически, без необходимости перезагрузки страницы.
      Цена каждого товара в корзине совпадает с ценой на карточке товара.

  - summary: |
      Проверка поддержки HTTPS для безопасного соединения
    requirement: |
      Поддержка HTTPS для обеспечения безопасного соединения
    prerequisites: |
      Сайт https://products-store.hexlet.app/ доступен
    test-data: |
      URL_HTTP = http://products-store.hexlet.app/
      URL_HTTPS = https://products-store.hexlet.app/
    steps:
      - Открыть сайт по адресу http://products-store.hexlet.app/ (без HTTPS)
      - Проверить, происходит ли автоматический редирект на https://products-store.hexlet.app/
      - Открыть сайт по адресу https://products-store.hexlet.app/
      - Проверить значок замка в адресной строке браузера
      - Проверить валидность SSL-сертификата (клик по значку замка → «Сертификат»)
      - Проверить наличие заголовка Strict-Transport-Security (HSTS) в ответе сервера
    expected-result: |
      При попытке открыть сайт по HTTP происходит автоматический редирект на HTTPS.
      В адресной строке отображается значок замка, предупреждений о безопасности нет.
      SSL-сертификат действителен, срок действия не истёк.
      Заголовок HSTS присутствует, что предотвращает понижение соединения до HTTP.

