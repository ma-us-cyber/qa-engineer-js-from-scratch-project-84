---
- summary: |
    Поиск товаров по ключевому слову не возвращает ожидаемые результаты
  environment: |
    Yandex	150.0.7871.1024 (64-разрядная версия)
    ОС	Windows 11 Version 25H2 (Build 26200.9445)
  steps-to-reproduce: |
      - Открыть главную страницу сайта https://products-store.hexlet.app/
      - Ввести в строку поиска Kiwi
      - Не выбирать категорию товара.
      - Нажать кнопку Поиск или клавишу Enter.
  expected-result: |
    Система должна показывать товары, содержащие слово Kiwi в названии, даже если категория не выбрана.
  actual-result: |
    Поиск по ключевому слову не выполняется, товары не отображаются.


- summary: |
    Смещение каталога на мобильной версии под фильтры
  environment: |
    Yandex	150.0.7871.1024 (64-разрядная версия)
    ОС	Windows 11 Version 25H2 (Build 26200.9445)
  steps-to-reproduce: |
      - Открыть главную страницу сайта https://products-store.hexlet.app/
      - Открыть сайт в эмуляторе мобильного устройства
      - Проверить отображение каталога товаров
  expected-result: |
    Каталог товаров корректно отображается на мобильном экране
  actual-result: |
    Каталог на мобильной версии сместился под фильтры
    Ошибка изображена на скриншоте "Смещение каталога в мобильной версии под фильтры.png" в папке screenshots


- summary: |
    Мобильная версия сайта отображается некорректно: шрифт и контент выходят за границы блоков
  environment: |
    Yandex	150.0.7871.1024 (64-разрядная версия)
    ОС	Windows 11 Version 25H2 (Build 26200.9445)
  steps-to-reproduce: |
      - Открыть главную страницу сайта https://products-store.hexlet.app/
      - Oткрываем DevTools
      - Выбираем мобильное тройство = iPhone SE 
      - Проверить отображение шапки, каталог товаров, карточек товаров
      - Протестировать кликабельность кнопок (корзина, «В корзину»)
      - Проверить отсутствие горизонтальной прокр
  expected-result: |
      Верстка адаптирована под мобильные экраны. Сайт корректно отображается, шрифт и контент не выходят за границы блоков
  actual-result: |
    Шрифт и контент выходят за границы блоков 
    Ошибка изображена на скриншоте "Шрифт и контент выходят за границы блоков.png" в папке screenshots

- summary: |
    Обрезание текста на кнопке на мобильной версии
  environment: |
    Chrome DevTools Mobile View
    Устройство: iPhone SE
    Ширина экрана: 375px
  steps-to-reproduce: |
    - Открыть сайт в эмуляторе мобильного устройства
    - Проверить отображение кнопок
  expected-result: |
    Название кнопки полностью помещается в границы кнопки
  actual-result: |
    Обрезание текста на кнопке на мобильной версии
    Ошибка изображена на скриншоте "Обрезание текста на кнопке в мобильной версии.png" в папке screenshots


- summary: |
    Описание товаров не переводится на русский язык, а выбранный язык сбрасывается после перезагрузки страницы
  environment: |
    Yandex	150.0.7871.1024 (64-разрядная версия)
    ОС	Windows 11 Version 25H2 (Build 26200.9445)
  steps-to-reproduce: |
      - Открыть главную страницу сайта https://products-store.hexlet.app/
      - Переключить язык интерфейса на Russian.
      - Открыть карточку товара или список товаров.
      - Проверить описание товара.
  expected-result: |
      Описание товаров должно отображаться на русском языке.
  actual-result: |
    Описание товаров отображается не на русском языке.  


- summary: |
    Неполная локализация интерфейса: часть текста не переведена на выбранный язык
  environment: |
    Yandex	150.0.7871.1024 (64-разрядная версия)
    ОС	Windows 11 Version 25H2 (Build 26200.9445)
  steps-to-reproduce: |
      - Открыть главную страницу сайта https://products-store.hexlet.app/
      - Переключить язык интерфейса на Russian.
      - Проверить содержимое основной страницы.
      - Обратить внимание на элементы интерфейса, меню, кнопки и тексты.
  expected-result: |
      Весь интерфейс страницы должен отображаться на русском языке без смешения языков.
  actual-result: |
      Часть страницы отображается на английском языке, несмотря на выбранный русский язык.
      Ошибка изображена на скриншоте "Часть текста не переведена на выбранный язык.png" в папке screenshots
