---
- summary: |
    Превышение времени загрузки страниц и низкая интуитивность навигации на основных страницах сайта
  environment: |
    Yandex	150.0.7871.1024 (64-разрядная версия)
    ОС	Windows 11 Version 25H2 (Build 26200.9445)
  steps-to-reproduce: |
      - Открыть главную страницу сайта https://products-store.hexlet.app/
      - Пройти по основным сценариям: поиск, фильтрация, добавление в корзину
      - Замерить время загрузки страниц (FCP, LCP)
      - Оценить интуитивность навигации (можно привлечь 3–5 тестовых пользователе
  expected-result: |
    Время загрузки основных страниц ≤ 2 сек при скорости соединения 3G. Элементы интерфейса интуитивно понятны, нет запутанных переходов. Оценка UX по шкале ≥ 4/5.
  actual-result: |
    Грузится 3,2–5,5 сек, UX = 3/5.

- summary: |
    Мобильная версия сайта отображается некорректно: шрифт и контент выходят за границы блоков
  environment: |
    Yandex	150.0.7871.1024 (64-разрядная версия)
    ОС	Windows 11 Version 25H2 (Build 26200.9445)
  steps-to-reproduce: |
      - Открыть главную страницу сайта https://products-store.hexlet.app/
      - Oткрываем DevTools
      - Выбираем мобильное тройство = iPhone SE 
      - Проверить отображение шапки, каталог товаров, карточек товаров
      - Протестировать кликабельность кнопок (корзина, «В корзину»)
      - Проверить отсутствие горизонтальной прокр
  expected-result: |
      Верстка адаптирована под мобильные экраны. Сайт корректно отображается, шрифт и контент не выходят за границы блоков
  actual-result: |
    Шрифт и контент выходят за границы блоков

