bugreports:

- summary: |
    Фильтрация товаров по бренду не работает
  environment: |
    Yandex	150.0.7871.1024 (64-разрядная версия)
    ОС	Windows 11 Version 25H2 (Build 26200.9445)
    Версия приложения: https://products-store-v2.hexlet.app/
    Дата прогона: 2026-09-21
  steps-to-reproduce: |
      - Открыть главную страницу сайта https://products-store-v2.hexlet.app/
      - Выбрать бренд Calvin Klein в фильтре.
      - Не выбирать не выбирать товар в наличии.
      - Нажать кнопку Поиск или клавишу Enter.
  expected-result: |
    В списке должны отображаться только товары выбранного бренда.
  actual-result: |
    Список товаров не фильтруется по выбранному бренду.

- summary: |
    Фильтрация товаров по наличию работает некорректно
  environment: |
    Yandex 150.0.7871.1024 (64-разрядная версия)
    ОС: Windows 11 Version 25H2 (Build 26200.9445)
    Версия приложения: https://products-store-v2.hexlet.app/
    Дата прогона: 2026-09-21
  steps-to-reproduce: |
    - Открыть главную страницу сайта https://products-store-v2.hexlet.app/
    - Убрать галочку с фильтра "в наличии"
  expected-result: |
    В списке не отображаются товары
  actual-result: |
    После выбора фильтра отображаются все товары, которые есть в наличии

- summary: |
    Смещение фильтров под каталог товаров на мобильной версии
  environment: |
    Yandex 150.0.7871.1024 (64-разрядная версия)
    ОС: Windows 11 Version 25H2 (Build 26200.9445)
    Версия приложения: https://products-store-v2.hexlet.app/
    Дата прогона: 2026-09-21
  steps-to-reproduce: |
    - Открыть главную страницу сайта https://products-store-v2.hexlet.app/
    - Открыть сайт в эмуляторе мобильного устройства
    - Проверить отображение фильтров и их нахождение 
  expected-result: |
    Фильтры корректно отображается на мобильном экране устройства
  actual-result: |
    Фильтры на мобильной версии сместились под каталог товаров
    Ошибка изображена на скриншоте "Фильтры сместились под каталог товаров.png" в папке screenshots

- summary: |
    Мобильная версия сайта отображается некорректно: изображения товаров слишком крупные и не помещаются в окно целиком
  environment: |
    Yandex	150.0.7871.1024 (64-разрядная версия)
    ОС	Windows 11 Version 25H2 (Build 26200.9445)
    Версия приложения: https://products-store-v2.hexlet.app/
    Дата прогона: 2026-09-21
  steps-to-reproduce: |
      - Открыть главную страницу сайта https://products-store.hexlet.app/
      - Oткрываем DevTools
      - Выбираем мобильное тройство = iPhone SE 
      - Проверить отображение шапки, каталог товаров, карточек товаров
      - Обратить внимание на размеры изображений.
  expected-result: |
    Верстка адаптирована под мобильные экраны. Изображения товаров корректно уменьшаются и помещаются в блоки карточек.
  actual-result: |
    Изображения товаров отображаются слишком крупно и не помещаются в окно целиком
    Ошибка изображена на скриншоте "Крупное изоброжение.png" в папке screenshots



